name : CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'

      - name: Verify Go version
        run: go version    

      - name: Build all go services
        run: |
          found=0
          fail=0
          for dir in backend/services/*/ backend/bff/; do
            if [ -f "$dir/go.mod" ]; then
              found=$((found + 1))
              echo "==> building $dir"
              (cd "$dir" && go build ./...) || fail=1
            fi
          done

          if [ "$found" -eq 0 ]; then
            echo "ERROR: Not found go module"
            exit 1
          fi

          echo "==> built $found modules"
          exit $fail

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'                   
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
        